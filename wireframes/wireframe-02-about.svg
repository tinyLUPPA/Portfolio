<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1115" width="1200" height="1115">
  <defs>
    <pattern id="wf-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F1F5F9" stroke-width="0.8" />
    </pattern>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .wf-h1 { font-size: 24px; font-weight: 700; fill: #111827; }
    .wf-h2 { font-size: 18px; font-weight: 700; fill: #111827; }
    .wf-h3 { font-size: 14px; font-weight: 700; fill: #111827; }
    .wf-body { font-size: 11px; fill: #374151; line-height: 1.5; }
    .wf-caption { font-size: 10px; fill: #6B7280; font-family: monospace; }
    .wf-label { font-size: 9px; font-weight: 700; fill: #111827; letter-spacing: 0.5px; text-transform: uppercase; }
    .box-border { stroke: #111827; stroke-width: 1.5; fill: #FFFFFF; }
    .box-subtle { stroke: #D1D5DB; stroke-width: 1; fill: #F9FAFB; }
    .img-x { stroke: #D1D5DB; stroke-width: 1; }
    .text-line { stroke: #9CA3AF; stroke-width: 4; stroke-linecap: round; }
    .text-line-thin { stroke: #9CA3AF; stroke-width: 2.5; stroke-linecap: round; }
  </style>

  <!-- Clean Canvas Background -->
  <rect width="1200" height="1115" fill="#FFFFFF"/>
  <rect width="1200" height="1115" fill="url(#wf-grid)"/>

  <!-- Top Metadata Bar (Assignment & Sheet Details) -->
  <g id="sheet-header">
    <rect x="0" y="0" width="1200" height="60" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
    
    <!-- Left Sheet Title -->
    <text x="32" y="25" class="wf-label" fill="#374151">TRADITIONAL WIREFRAME // SHEET 02 OF 07</text>
    <text x="32" y="46" font-size="16" font-weight="700" fill="#111827">ABOUT ME <tspan font-weight="400" fill="#6B7280">(about.html)</tspan></text>

    <!-- Center Assignment Info -->
    <rect x="440" y="14" width="320" height="32" rx="3" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
    <text x="600" y="34" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">BCS 3584 &#8226; WEB APPLICATION DEVELOPMENT</text>

    <!-- Right Student Meta -->
    <text x="1168" y="25" font-size="11" fill="#374151" text-anchor="end">STUDENT: <tspan font-weight="700" fill="#111827">Muhammad Yusuf Bin Alias</tspan></text>
    <text x="1168" y="46" font-size="11" fill="#374151" text-anchor="end">MATRIC: <tspan font-weight="700" fill="#111827">Yusuf_24B10I007</tspan> | DESKTOP 1120px</text>
  </g>

  <!-- Browser Window Frame Simulation -->
  <g id="browser-window" transform="translate(40, 75)">
    <!-- Browser Titlebar -->
    <rect x="0" y="0" width="1120" height="36" rx="4" fill="#F9FAFB" stroke="#111827" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="4.5" fill="none" stroke="#111827" stroke-width="1.2"/>
    <circle cx="32" cy="18" r="4.5" fill="none" stroke="#111827" stroke-width="1.2"/>
    <circle cx="46" cy="18" r="4.5" fill="none" stroke="#111827" stroke-width="1.2"/>

    <!-- URL Bar -->
    <rect x="70" y="6" width="600" height="24" rx="2" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="82" y="22" font-size="11" fill="#374151" font-family="monospace">https://yusuf.dev/about.html</text>

    <!-- Scale Indicator -->
    <text x="1105" y="22" class="wf-caption" text-anchor="end">1120 &#215; 985px</text>
  </g>

  <!-- Page Canvas Body -->
  <g id="wireframe-content" transform="translate(40, 111)">
    <rect x="0" y="0" width="1120" height="985" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
    
    <!-- [HEADER / NAVBAR] -->
    <g id="nav-header" transform="translate(0, 0)">
      <rect x="0" y="0" width="1120" height="54" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
      
      <!-- Brand Logo Box -->
      <rect x="30" y="12" width="120" height="30" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
      <text x="90" y="31" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">&lt;YUSUF.DEV/&gt;</text>
      
      <!-- Nav Items -->
      <g transform="translate(420, 14)">
        <g transform="translate(0, 0)">
          <text x="0" y="17" font-size="11" font-weight="400" fill="#111827">Home /&gt;</text>
        </g>
        <g transform="translate(86, 0)">
          <text x="0" y="17" font-size="11" font-weight="700" fill="#111827">About /&gt;</text>
          <line x1="0" y1="24" x2="55" y2="24" stroke="#111827" stroke-width="2"/>
        </g>
        <g transform="translate(172, 0)">
          <text x="0" y="17" font-size="11" font-weight="400" fill="#111827">Awards /&gt;</text>
        </g>
        <g transform="translate(258, 0)">
          <text x="0" y="17" font-size="11" font-weight="400" fill="#111827">Experience /&gt;</text>
        </g>
        <g transform="translate(344, 0)">
          <text x="0" y="17" font-size="11" font-weight="400" fill="#111827">Tech /&gt;</text>
        </g>
        <g transform="translate(430, 0)">
          <text x="0" y="17" font-size="11" font-weight="400" fill="#111827">Interests /&gt;</text>
        </g>
        <g transform="translate(516, 0)">
          <rect x="0" y="0" width="95" height="26" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
          <text x="47" y="17" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">Contact /&gt;</text>
        </g>
      </g>
    </g>
    <!-- [PAGE HEADER BANNER] -->
    <g id="page-banner" transform="translate(0, 54)">
      <rect x="0" y="0" width="1120" height="115" fill="#F9FAFB" stroke="#111827" stroke-width="1"/>
      
      <!-- Breadcrumb -->
      <text x="35" y="28" class="wf-caption">Home / About Me</text>
      
      <!-- Title & Subtitle -->
      <text x="35" y="55" class="wf-h1">About Muhammad Yusuf</text>
      <text x="35" y="74" class="wf-body">Academic background at UCTATI, career ambitions, and official university networks.</text>
      
      <!-- Internal In-page Jump Anchor Bar -->
      <g transform="translate(35, 86)">
        <text x="0" y="14" class="wf-label">SECTIONS:</text>
        <rect x="70" y="0" width="97" height="20" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
        <text x="118" y="14" font-size="9" fill="#374151" text-anchor="middle"># academic-bg</text>
        <rect x="175" y="0" width="132" height="20" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
        <text x="241" y="14" font-size="9" fill="#374151" text-anchor="middle"># career-ambitions</text>
        <rect x="315" y="0" width="132" height="20" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
        <text x="381" y="14" font-size="9" fill="#374151" text-anchor="middle"># university-links</text>
      </g>
    </g>
    <!-- [ACADEMIC BACKGROUND SECTION] -->
    <g id="academic-bg" transform="translate(0, 185)">
      <g transform="translate(35, 20)">
        <text x="0" y="0" class="wf-label">// ACADEMIC FOUNDATION</text>
        <text x="0" y="22" class="wf-h2">Academic Background &amp; Education</text>
      </g>

      <g transform="translate(35, 60)">
        <!-- Card 1: Degree -->
        <rect x="0" y="0" width="510" height="190" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
        <text x="20" y="30" class="wf-h3">University College TATI (UCTATI)</text>
        <text x="20" y="48" class="wf-caption">BIBM (HONOURS) &#8226; 2024 - 2027</text>
        
        <g transform="translate(20, 70)">
          <line x1="0" y1="0" x2="460" y2="0" class="text-line"/>
          <line x1="0" y1="14" x2="430" y2="14" class="text-line"/>
          <line x1="0" y1="28" x2="400" y2="28" class="text-line"/>
        </g>

        <!-- Metric badges -->
        <g transform="translate(20, 130)">
          <rect x="0" y="0" width="130" height="40" fill="#F9FAFB" stroke="#111827" stroke-width="1"/>
          <text x="15" y="22" font-size="14" font-weight="700">3.92 CGPA</text>
          <text x="15" y="33" class="wf-caption">Academic Distinction</text>

          <rect x="145" y="0" width="130" height="40" fill="#F9FAFB" stroke="#111827" stroke-width="1"/>
          <text x="160" y="22" font-size="14" font-weight="700">Dean's List</text>
          <text x="160" y="33" class="wf-caption">Top 5% Faculty</text>
        </g>

        <!-- Card 2: Foundations -->
        <g transform="translate(540, 0)">
          <rect x="0" y="0" width="510" height="190" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <text x="20" y="30" class="wf-h3">Pre-University &amp; Computing Foundations</text>
          <text x="20" y="48" class="wf-caption">Computer Systems &amp; Mathematics Track</text>

          <g transform="translate(20, 70)">
            <line x1="0" y1="0" x2="460" y2="0" class="text-line"/>
            <line x1="0" y1="14" x2="420" y2="14" class="text-line"/>
            <line x1="0" y1="28" x2="380" y2="28" class="text-line"/>
          </g>

          <g transform="translate(20, 130)">
            <rect x="0" y="0" width="160" height="40" fill="#F9FAFB" stroke="#111827" stroke-width="1"/>
            <text x="15" y="22" font-size="13" font-weight="700">Networking Basics</text>
            <text x="15" y="33" class="wf-caption">Core Certifications</text>
          </g>
        </g>
      </g>
    </g>

    <!-- [CAREER AMBITIONS - 3 PILLARS] -->
    <g id="career-ambitions" transform="translate(0, 465)">
      <line x1="0" y1="0" x2="1120" y2="0" stroke="#111827" stroke-width="1"/>

      <g transform="translate(35, 20)">
        <text x="0" y="0" class="wf-label">// STRATEGIC AMBITIONS</text>
        <text x="0" y="22" class="wf-h2">Career Goals &amp; Professional Focus</text>
      </g>

      <g transform="translate(35, 60)">
        <!-- Pillar 1 -->
        <rect x="0" y="0" width="330" height="180" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
        <text x="20" y="32" class="wf-h3">Enterprise Network Defense</text>
        <g transform="translate(20, 55)">
          <line x1="0" y1="0" x2="280" y2="0" class="text-line-thin"/>
          <line x1="0" y1="12" x2="260" y2="12" class="text-line-thin"/>
          <line x1="0" y1="24" x2="240" y2="24" class="text-line-thin"/>
        </g>
        <text x="20" y="145" class="wf-caption">[Focus: Router Security, Firewalls, Topologies]</text>

        <!-- Pillar 2 -->
        <g transform="translate(360, 0)">
          <rect x="0" y="0" width="330" height="180" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <text x="20" y="32" class="wf-h3">OSINT &amp; Fraud Investigation</text>
          <g transform="translate(20, 55)">
            <line x1="0" y1="0" x2="280" y2="0" class="text-line-thin"/>
            <line x1="0" y1="12" x2="260" y2="12" class="text-line-thin"/>
            <line x1="0" y1="24" x2="220" y2="24" class="text-line-thin"/>
          </g>
          <text x="20" y="145" class="wf-caption">[Focus: Phishing Tracking, Domain Mapping]</text>
        </g>

        <!-- Pillar 3 -->
        <g transform="translate(720, 0)">
          <rect x="0" y="0" width="330" height="180" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <text x="20" y="32" class="wf-h3">Secure Web Engineering</text>
          <g transform="translate(20, 55)">
            <line x1="0" y1="0" x2="280" y2="0" class="text-line-thin"/>
            <line x1="0" y1="12" x2="260" y2="12" class="text-line-thin"/>
            <line x1="0" y1="24" x2="250" y2="24" class="text-line-thin"/>
          </g>
          <text x="20" y="145" class="wf-caption">[Focus: OWASP Standards, Modern HTML5/CSS3]</text>
        </g>
      </g>
    </g>

    <!-- [UNIVERSITY NETWORKS SECTION - REQ 8] -->
    <g id="university-links" transform="translate(0, 735)">
      <line x1="0" y1="0" x2="1120" y2="0" stroke="#111827" stroke-width="1"/>

      <g transform="translate(35, 20)">
        <text x="0" y="0" class="wf-label">// EXTERNAL LINKS (REQ #8)</text>
        <text x="0" y="22" class="wf-h2">Official University &amp; Higher Education Networks</text>
      </g>

      <g transform="translate(35, 60)">
        <!-- External Card 1 -->
        <rect x="0" y="0" width="510" height="110" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
        <text x="20" y="25" class="wf-caption">ACADEMIC INSTITUTION</text>
        <text x="20" y="46" class="wf-h3">University College TATI (UCTATI) Official Portal</text>
        <text x="20" y="65" class="wf-body">Official web portal for faculties, curriculum, and research departments.</text>
        <text x="20" y="90" font-size="10" font-weight="700" fill="#111827">[EXT LINK] Visit UCTATI Portal &#8594; (https://www.uctati.edu.my)</text>

        <!-- External Card 2 -->
        <g transform="translate(540, 0)">
          <rect x="0" y="0" width="510" height="110" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
          <text x="20" y="25" class="wf-caption">GOVERNMENT REGULATORY BODY</text>
          <text x="20" y="46" class="wf-h3">Ministry of Higher Education Malaysia (MOHE)</text>
          <text x="20" y="65" class="wf-body">Governing agency for tertiary education standards and accreditations.</text>
          <text x="20" y="90" font-size="10" font-weight="700" fill="#111827">[EXT LINK] Visit MOHE Portal &#8594; (https://www.mohe.gov.my)</text>
        </g>
      </g>
    </g>
    
    <!-- [FOOTER - RUBRIC REQUIREMENT 12] -->
    <g id="footer" transform="translate(0, 935)">
      <rect x="0" y="0" width="1120" height="65" fill="#F9FAFB" stroke="#111827" stroke-width="1.5"/>
      
      <!-- Exact Rubric Text -->
      <text x="35" y="37" font-size="11" font-weight="700" fill="#111827">Yusuf_24B10I007&#169;Copyright.2026</text>
      
      <!-- Social Media Text Links -->
      <g transform="translate(420, 24)">
        <text x="0" y="15" font-size="10" fill="#374151">[GitHub]</text>
        <text x="65" y="15" font-size="10" fill="#374151">[X / Twitter]</text>
        <text x="150" y="15" font-size="10" fill="#374151">[Instagram]</text>
        <text x="235" y="15" font-size="10" fill="#374151">[Facebook]</text>
      </g>
      
      <!-- Back to Top Button -->
      <g transform="translate(970, 18)">
        <rect x="0" y="0" width="115" height="28" rx="2" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
        <text x="57" y="18" font-size="10" font-weight="600" fill="#111827" text-anchor="middle">Back to Top &#8593;</text>
      </g>
    </g>
  </g>
</svg>