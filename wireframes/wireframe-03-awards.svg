        <g transform="translate(20, 50)">
          <text x="0" y="16" class="wf-body">Master at Programming Language</text>
          <text x="220" y="16" class="wf-caption">[Advanced]</text>
          <line x1="0" y1="28" x2="280" y2="28" stroke="#E5E7EB" stroke-width="1"/>

