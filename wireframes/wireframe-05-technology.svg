    <text x="82" y="22" font-size="11" fill="#374151" font-family="monospace">https://yusuf.dev/technology.html</text>

    <!-- Scale Indicator -->
    <text x="1105" y="22" class="wf-caption" text-anchor="end">1120 &#215; 930px</text>
