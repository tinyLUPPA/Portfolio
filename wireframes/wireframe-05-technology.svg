            <text x="0" y="55" class="wf-body">&#8226; Firewall &amp; Router Topologies</text>
            <text x="0" y="75" class="wf-body">&#8226; Intrusion Detection Concepts</text>
            <text x="0" y="95" class="wf-body">&#8226; Vulnerability Auditing Tools</text>
          </g>
          <text x="20" y="195" class="wf-caption">[Network Security Suite]</text>
