        <text x="0" y="22" class="wf-h2">Global Standards, Frameworks &amp; Technical Publications</text>
      </g>

      <g transform="translate(35, 55)">
        <!-- Link 1 -->
        <rect x="0" y="0" width="510" height="105" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
