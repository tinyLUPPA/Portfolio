          <text x="20" y="24" class="wf-caption">THREAT FRAMEWORK</text>
          <text x="20" y="44" class="wf-h3">MITRE ATT&amp;CK Knowledge Base</text>
          <text x="20" y="62" class="wf-body">Curated knowledge repository of adversary tactics and techniques.</text>
          <text x="20" y="85" font-size="10" font-weight="700" fill="#111827">[EXT LINK] Explore MITRE ATT&amp;CK &#8594; (https://attack.mitre.org)</text>
        </g>

        <!-- Link 3 -->
        <g transform="translate(0, 120)">
          <rect x="0" y="0" width="510" height="105" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
          <text x="20" y="24" class="wf-caption">SECURITY GUIDANCE</text>
          <text x="20" y="44" class="wf-h3">NIST Cybersecurity Framework (CSF)</text>
          <text x="20" y="62" class="wf-body">National standard framework for reducing organizational cyber risk.</text>
          <text x="20" y="85" font-size="10" font-weight="700" fill="#111827">[EXT LINK] Visit NIST CSF Portal &#8594; (https://www.nist.gov/cyberframework)</text>
        </g>

        <!-- Link 4 -->
        <g transform="translate(540, 120)">
          <rect x="0" y="0" width="510" height="105" fill="#F9FAFB" stroke="#111827" stroke-width="1.2"/>
          <text x="20" y="24" class="wf-caption">TECHNICAL JOURNALISM</text>
          <text x="20" y="44" class="wf-h3">MIT Technology Review</text>
          <text x="20" y="62" class="wf-body">Authoritative analysis of commercial and societal tech breakthroughs.</text>
          <text x="20" y="85" font-size="10" font-weight="700" fill="#111827">[EXT LINK] Read MIT Tech Review &#8594; (https://www.technologyreview.com)</text>
