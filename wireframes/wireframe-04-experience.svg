          <text x="320" y="26" class="wf-body">2028</text>
          <text x="420" y="26" class="wf-body">Global Collegiate Arena</text>
          <text x="680" y="26" font-size="11" font-weight="700">[2nd Place Worldwide]</text>
          <text x="880" y="26" class="wf-body">Network PenTesting</text>

          <!-- Row 2 -->
          <g transform="translate(0, 42)">
            <line x1="0" y1="0" x2="1050" y2="0" stroke="#E5E7EB" stroke-width="1"/>
            <text x="20" y="26" class="wf-body" font-weight="600">Innovation In IT Award</text>
            <text x="320" y="26" class="wf-body">2028</text>
            <text x="420" y="26" class="wf-body">Industry Technology Panel</text>
            <text x="680" y="26" font-size="11" font-weight="700">[Excellence Award]</text>
            <text x="880" y="26" class="wf-body">Anti-Scam Architecture</text>
          </g>

          <!-- Row 3 -->
          <g transform="translate(0, 84)">
            <line x1="0" y1="0" x2="1050" y2="0" stroke="#E5E7EB" stroke-width="1"/>
            <text x="20" y="26" class="wf-body" font-weight="600">Japan Tech Innovation</text>
            <text x="320" y="26" class="wf-body">2027</text>
            <text x="420" y="26" class="wf-body">International Stage (Tokyo)</text>
            <text x="680" y="26" font-size="11" font-weight="700">[5th Place Worldwide]</text>
            <text x="880" y="26" class="wf-body">System Prototyping</text>
          </g>

          <!-- Row 4 -->
          <g transform="translate(0, 126)">
            <line x1="0" y1="0" x2="1050" y2="0" stroke="#E5E7EB" stroke-width="1"/>
            <text x="20" y="26" class="wf-body" font-weight="600">UCTATI Network Challenge</text>
            <text x="320" y="26" class="wf-body">2024</text>
            <text x="420" y="26" class="wf-body">Campus Engineering Division</text>
            <text x="680" y="26" font-size="11" font-weight="700">[Champion (1st Place)]</text>
            <text x="880" y="26" class="wf-body">Routing &amp; Switches</text>
          </g>
        </g>
      </g>
    </g>

    <!-- [TIMELINE SECTION] -->
