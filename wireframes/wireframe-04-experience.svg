          <rect x="45" y="0" width="970" height="85" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <text x="65" y="24" font-size="10" font-weight="700">JUNE 2027 // 5TH POSITION WORLDWIDE</text>
