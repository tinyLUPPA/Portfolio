          <rect x="45" y="0" width="970" height="85" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <text x="65" y="24" font-size="10" font-weight="700">AUGUST 2028 // 2ND POSITION WORLDWIDE</text>
          <text x="65" y="42" class="wf-h3">Network Hacking Challenge 2028 (Global Finals)</text>
          <g transform="translate(65, 56)">
            <line x1="0" y1="0" x2="800" y2="0" class="text-line-thin"/>
            <line x1="0" y1="10" x2="720" y2="10" class="text-line-thin"/>
          </g>
        </g>

        <!-- Node 2 -->
        <g transform="translate(0, 125)">
          <circle cx="20" cy="18" r="8" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
          <rect x="45" y="0" width="970" height="85" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <text x="65" y="24" font-size="10" font-weight="700">FEBRUARY 2028 // SPECIAL RECOGNITION</text>
          <text x="65" y="42" class="wf-h3">Innovation In IT Award – Threat Intelligence Initiative</text>
          <g transform="translate(65, 56)">
            <line x1="0" y1="0" x2="800" y2="0" class="text-line-thin"/>
            <line x1="0" y1="10" x2="700" y2="10" class="text-line-thin"/>
          </g>
        </g>

        <!-- Node 3 -->
